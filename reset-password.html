<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your TOYP UNIBEN nominee portal password.">
  <title>Password Reset | TOYP UNIBEN</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:#f3f6fb;color:#18243a;font-family:Manrope,Arial,sans-serif;display:grid;place-items:center}
    main{width:min(100%,480px);padding:clamp(22px,5vw,40px);background:#fff;border:1px solid #e4eaf2;border-radius:20px;box-shadow:0 18px 55px rgba(15,42,80,.09)}
    img{display:block;width:100px;height:64px;object-fit:contain;margin:0 auto 18px}p{text-align:center;color:#68758a;line-height:1.6}h1{text-align:center;font-size:1.8rem}
    label{display:block;margin:18px 0 7px;font-weight:700;font-size:.9rem}input{width:100%;min-height:48px;border:1px solid #ccd6e3;border-radius:10px;padding:12px;font:inherit;font-size:16px}
    button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:10px;background:#087eb8;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}
    .message{display:none;padding:12px;border-radius:10px;margin-top:16px;font-size:.9rem;line-height:1.5}.message.show{display:block}.message.error{background:#fff0f0;color:#a32121}.message.success{background:#eaf9f0;color:#17643a}
    a{display:block;text-align:center;margin-top:20px;color:#087eb8}@media(max-width:380px){main{padding:22px 17px}}
  </style>
</head>
<body>
  <main>
    <img src="images/toyp-logo.png" alt="TOYP UNIBEN">
    <h1 id="page-title">Reset your password</h1>
    <p id="page-description">Enter the email address linked to your nominee account. We will send you a secure password reset link.</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="request-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>
      <button id="request-button" type="submit">Send reset link</button>
    </form>

    <form id="update-form" class="hidden">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      <button id="update-button" type="submit">Update password</button>
    </form>
    <a href="profile.html">Return to nominee login</a>
  </main>
  <script src="config.js"></script>
  <script type="module" src="scripts/reset-password.js"></script>
</body>
</html>
